services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Local dev credentials only — never used in production.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biz_scraper
    ports:
      # Host port 5433 avoids clashing with a native Postgres install that
      # may already be listening on 5432.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
